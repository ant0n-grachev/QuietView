name: QuietView checks

on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Check JavaScript syntax
        run: |
          for script in extension/*.js; do node --check "$script"; done
          python tests/check_version.py
      - name: Install Playwright and Chromium
        run: |
          python -m pip install -r requirements-dev.txt
          python -m playwright install --with-deps chromium
          browser=$(python -c 'from playwright.sync_api import sync_playwright; p = sync_playwright().start(); print(p.chromium.executable_path); p.stop()')
          echo "CHROMIUM_PATH=$browser" >> "$GITHUB_ENV"
          "$browser" --version
      - name: Core and fixture suites
        run: |
          xvfb-run -a python tests/test_core.py
          python tests/test_timeline_fixtures.py
          python tests/test_attention_regressions.py
      - name: Installed extension suite
        run: python tests/test_browser.py --headless
